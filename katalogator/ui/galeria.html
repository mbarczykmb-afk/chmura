<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteka — Katalogator</title>
<link rel="icon" href="/ui/ikona.png">
<link rel="stylesheet" href="/ui/mapa/leaflet.css">
<link rel="stylesheet" href="/ui/mapa/MarkerCluster.css">
<link rel="stylesheet" href="/ui/mapa/MarkerCluster.Default.css">
<style>
:root{--bg:#fff;--panel:#f3f6fb;--fg:#0f172a;--mut:#5b6b86;--lin:#e1e7f0;--akc:#2563eb;--akc-fg:#fff;--akc-miekki:#e9f0ff;--ok:#059669;--blad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a15;--panel:#0d1426;--fg:#e7ecf7;--mut:#8a97b4;--lin:#1c2742;--akc:#5b8cff;--akc-fg:#fff;--akc-miekki:rgba(91,140,255,.16);--ok:#34d399;--blad:#f87171}}
:root[data-theme="dark"]{--bg:#060a15;--panel:#0d1426;--fg:#e7ecf7;--mut:#8a97b4;--lin:#1c2742;--akc:#5b8cff;--akc-fg:#fff;--akc-miekki:rgba(91,140,255,.16);--ok:#34d399;--blad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--lin);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--akc)}
button.akt{background:var(--akc);color:var(--akc-fg);border-color:var(--akc)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--lin);flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap}
header .odstep{flex:1}
.info{color:var(--mut);font-size:12.5px}
.chipy{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--lin);scrollbar-width:thin;flex:none}
.chipy button{white-space:nowrap;border-radius:999px;padding:4px 12px;font-size:13px}
.chipy button small{color:var(--mut);margin-left:4px}
.chipy button.akt small{color:inherit;opacity:.8}
main{flex:1;min-height:0;position:relative}
#os{position:absolute;inset:0;display:flex;flex-direction:column}
#siatka{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,200px);grid-auto-rows:max-content;gap:10px;align-content:start;justify-content:start}
.k{min-height:max-content}
@supports not (aspect-ratio:1/1){.k .ob{height:0;padding-top:75%}.k .ob>*{position:absolute}}
.k{border:1px solid var(--lin);border-radius:10px;overflow:hidden;background:var(--panel);cursor:zoom-in}
.k .ob{aspect-ratio:4/3;background:var(--lin);display:grid;place-items:center;font-size:40px;position:relative}
.k .ob img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.k .op{padding:5px 8px;font-size:12px}
.k .op div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k .op .m{color:var(--mut)}
.wiecej{grid-column:1/-1;justify-self:center;margin:10px}
#mapa{position:absolute;inset:0}
#mapa-info{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:500;background:var(--bg);border:1px solid var(--lin);border-radius:999px;padding:4px 12px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:92%;text-align:center}
.popup img{display:block;width:220px;max-width:62vw;aspect-ratio:4/3;object-fit:contain;background:#eee;border-radius:6px;cursor:zoom-in}
.popup .n{font-weight:600;margin-top:6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .m{color:#666;font-size:12px}
.popup button{margin-top:6px;width:100%;padding:4px}
.leaflet-popup-content{margin:10px}
/* podgląd na cały ekran */
#pelny{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:flex;align-items:center;justify-content:center;color:#fff}
#pelny img,#pelny video{max-width:96vw;max-height:88vh;object-fit:contain}
#pelny-tresc{touch-action:none}
#pelny img{transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none}
#pelny img.zoom{cursor:grab} #pelny img.zoom.ciagnie{cursor:grabbing}
#pelny .skala{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border-radius:999px;padding:4px 12px;font-size:13px;pointer-events:none;transition:opacity .4s}
#pelny .opis{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:13px;text-align:center}
#pelny .zam,#pelny .pop,#pelny .nast{position:absolute;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:22px;border-radius:999px;width:44px;height:44px;padding:0}
#pelny .zam{top:12px;right:12px}
#pelny .pop{left:12px;top:50%}
#pelny .nast{right:12px;top:50%}
/* logowanie PIN-em (telefon) */
#login{position:fixed;inset:0;background:var(--bg);z-index:3000;display:grid;place-items:center;padding:20px}
#login form{max-width:320px;width:100%;text-align:center}
#login input{font:inherit;font-size:24px;letter-spacing:6px;text-align:center;width:100%;padding:10px;border:1px solid var(--lin);border-radius:10px;background:var(--panel);color:var(--fg);margin:14px 0}
#login button{width:100%;padding:10px;background:var(--akc);color:var(--akc-fg);border-color:var(--akc);font-weight:600}
#login .bl{color:var(--blad);min-height:20px}
/* panel „na telefon” */
#telefon{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2500;display:grid;place-items:center;padding:16px}
#telefon .okno{background:var(--bg);border-radius:14px;padding:20px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#telefon h2{margin:0 0 8px;font-size:18px}
#telefon .qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0}
#telefon .qr>div:first-child{background:#fff;padding:8px;border-radius:8px}
#telefon .pin{font-size:30px;font-weight:700;letter-spacing:4px;color:var(--fg)}
#telefon code{background:var(--panel);padding:2px 6px;border-radius:5px;word-break:break-all}
#telefon .tel-ster{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:6px;color:var(--fg)}
#telefon .tel-pin{margin-top:6px;font-size:12.5px;padding:4px 10px}
#telefon ul{padding-left:18px;margin:8px 0;color:var(--mut);font-size:13px}
.pusto{grid-column:1/-1;color:var(--mut);padding:30px;text-align:center}
@media (max-width:600px){
  header{padding:8px 10px} header h1{font-size:15px}
  #siatka{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));padding:8px;gap:6px}
  .k .op{display:none}
}

/* --- wykres: ile zdjęć w każdym miesiącu (klik = ten miesiąc) --- */
.wykres{flex:none;position:relative;border-bottom:1px solid var(--lin);padding:10px 14px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--akc) 5%,transparent),transparent)}
#wykres:not([hidden]) ~ #lata{display:none}  /* lata są podpisane pod wykresem */
.w-tor{display:flex;gap:10px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.w-rok{flex:0 1 auto;min-width:84px;width:calc(12 * 36px);display:flex;flex-direction:column}
.w-slupki{height:88px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid color-mix(in srgb,var(--mut) 45%,transparent)}
.w-s{flex:1 1 0;min-width:5px;max-width:34px;height:100%;padding:0;border:0;border-radius:0;background:none;display:flex;align-items:flex-end;cursor:pointer}
.w-s:disabled{cursor:default}
.w-s i{display:block;width:100%;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--akc) 45%,transparent);transition:background .15s,height .35s ease}
.w-rok.akt .w-s i{background:var(--akc)}
.w-s:hover:not(:disabled) i,.w-s:focus-visible i{background:color-mix(in srgb,var(--akc) 75%,var(--fg))}
.w-s.akt i{background:var(--akc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--akc)}
.w-s:focus-visible{outline:none}
.w-et{border:0;background:none;padding:3px 0 6px;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;text-align:left;border-radius:4px}
.w-rok.akt .w-et{color:var(--fg);font-weight:700}
.w-max{position:absolute;right:16px;top:6px;font-size:11px;color:var(--mut);pointer-events:none;background:var(--bg);padding:0 4px;border-radius:4px}
#w-tip{position:fixed;z-index:4000;pointer-events:none;background:var(--panel);color:var(--fg);border:1px solid var(--lin);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
#w-tip b{display:block;font-size:15px}
#w-tip span{color:var(--mut)}
/* --- przeglądarka dysków --- */
.prz{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--lin);background:var(--panel)}
.prz-f{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border:1px solid var(--lin);border-radius:999px;background:var(--bg);font-size:13px;max-width:320px}
.prz-f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.prz-f button{border:0;padding:0 6px;background:none;color:var(--mut)} .prz-f button:hover{color:var(--blad)}
.prz .info{flex:1;min-width:160px}
.prz-pasek{flex-basis:100%;height:4px;border-radius:4px;background:var(--lin);overflow:hidden}
.prz-pasek i{display:block;height:100%;background:var(--akc);transition:width .5s}
#wybierz{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2600;display:grid;place-items:center;padding:16px}
#wybierz .okno{background:var(--bg);border-radius:14px;padding:18px;width:min(560px,100%);height:min(560px,90vh);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#wyb-sciezka{font-size:13px;color:var(--mut);word-break:break-all}
#wyb-lista{flex:1;overflow:auto;border:1px solid var(--lin);border-radius:10px;padding:4px}
#wyb-lista button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:7px 10px;background:none}
#wyb-lista button:hover{background:var(--akc-miekki)}
@media (max-width:600px){.w-slupki{height:64px}.w-rok{min-width:72px}}

/* --- wyszukiwarka, filtry, kolekcje --- */
#szukaj{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--lin);border-radius:999px;padding:6px 14px;width:min(340px,100%);min-width:0}
#szukaj:focus{outline:none;border-color:var(--akc);box-shadow:0 0 0 3px color-mix(in srgb,var(--akc) 22%,transparent)}
.filtr{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--lin)}
.filtr .tyt{font-weight:700;font-size:15px}
.filtr .zn{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--akc) 45%,var(--lin));background:var(--akc-miekki);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px}
.filtr .zn button{border:0;background:none;padding:0 6px;color:var(--mut)}
.filtr .dzien{border-radius:999px;font-size:13px;padding:4px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--akc) 14%,transparent),transparent);border-color:color-mix(in srgb,var(--akc) 40%,var(--lin))}
.k.album .ob{font-size:46px}
.k.album .op div:first-child{font-weight:700}
.k.nowy .ob{border:2px dashed var(--lin);background:none}
.k .znak-f{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;z-index:1}
.k .gw{position:absolute;left:6px;top:6px;z-index:1;font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#mapa-os{position:absolute;right:12px;top:10px;z-index:600;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#pelny .narz{position:absolute;top:12px;left:12px;display:flex;gap:8px;z-index:2}
#pelny .narz button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:999px;height:40px;padding:0 14px;font-size:14px}
#pelny .narz button.akt{background:#f5b800;color:#111}
#pelny .narz button:hover{background:rgba(255,255,255,.24)}
#pelny .film-blad{max-width:520px;text-align:center;line-height:1.6}
#pelny .film-blad button,#pelny .film-blad a{margin-top:10px;display:inline-block;background:#fff;color:#111;border-radius:999px;padding:8px 16px;text-decoration:none;border:0}
.menu-alb{position:absolute;top:58px;left:12px;background:var(--bg);color:var(--fg);border-radius:12px;padding:6px;min-width:220px;max-height:60vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:3}
.menu-alb button{display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:8px 10px;background:none}
.menu-alb button:hover{background:var(--akc-miekki)}
.prz label{font-size:12.5px;color:var(--mut);display:inline-flex;gap:5px;align-items:center}
@media (max-width:600px){#szukaj{order:5;width:100%}}
.zestaw{display:inline-flex;align-items:center;gap:0;border:1px solid var(--lin);border-radius:10px;overflow:hidden;background:var(--bg)}
.zestaw select{border:0;border-radius:0;font-weight:700;max-width:220px;background:none}
.zestaw button{border:0;border-left:1px solid var(--lin);border-radius:0;padding:6px 9px;background:none}
.zestaw button:hover{background:var(--akc-miekki)}
.rok-nagl{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:14px 2px 2px;font-weight:700;font-size:17px}
.rok-nagl:first-child{margin-top:2px}
.rok-nagl small{color:var(--mut);font-weight:500;font-size:13px}
.dzien-nav{display:inline-flex;align-items:center;gap:4px}
.dzien-nav b{min-width:120px;text-align:center}
.k .ob .kosz{position:absolute;top:6px;right:6px;z-index:2;width:32px;height:32px;padding:0;border-radius:999px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px;opacity:0;transition:opacity .15s;display:grid;place-items:center}
.k:hover .ob .kosz,.k .ob .kosz:focus-visible{opacity:1}
.k .ob .kosz:hover{background:#dc2626}
@media (hover:none){.k .ob .kosz{opacity:.85}}
#p-usun:hover{background:#dc2626;border-color:#dc2626;color:#fff}
#toast-g{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:4000;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:14px;max-width:92vw}
#toast-g button{background:none;border:0;color:var(--akc);font-weight:700;padding:4px 6px}
</style>
</head>
<body>
<header>
  <h1>📚 Biblioteka</h1>
  <button id="w-os" class="akt">📅 Oś czasu</button>
  <button id="w-mapa">🗺 Mapa</button>
  <button id="w-kolekcje" title="Ulubione i albumy">⭐ Kolekcje</button>
  <button id="w-dzien" title="Zdjęcia z tego samego dnia w poprzednich latach">🕰 Tego dnia</button>
  <input id="szukaj" type="search" placeholder="🔍 Szukaj: Hel, lipiec 2019, Włochy, nazwa…" autocomplete="off"
         title="Miejsce (miejscowość, kraj), rok, miesiąc, fragment nazwy pliku lub folderu, aparat — można łączyć">
  <span class="info" id="licznik"></span>
  <span class="odstep"></span>
  <select id="zakres" hidden title="Które zdjęcia pokazać">
    <option value="biblioteka">Biblioteka (miejsce docelowe)</option>
    <option value="wszystko">Wszystko w projekcie</option>
    <option value="przegladarka">🔭 Przeglądarka dysków</option>
  </select>
  <button id="na-telefon" hidden title="Oglądaj bibliotekę na telefonie (sieć domowa / Tailscale)">📱 Na telefon</button>
  <button id="zamknij" hidden title="Wróć do porządkowania">✕</button>
</header>
<div class="prz" id="prz" hidden>
  <span class="zestaw" title="Zestaw dysków — np. „Rodzina”, „Praca”: każdy ma swoją listę dysków i folderów">
    <select id="prz-zestaw" aria-label="Zestaw dysków"></select>
    <button id="prz-z-nowy" title="Nowy zestaw dysków">＋</button>
    <button id="prz-z-nazwa" title="Zmień nazwę zestawu">✎</button>
    <button id="prz-z-usun" title="Usuń zestaw (dyski i zdjęcia zostają)">🗑</button>
  </span>
  <span id="prz-foldery" style="display:contents"></span>
  <button id="prz-dodaj" title="Dodaj dysk lub folder do przeglądania">＋ Dysk lub folder</button>
  <button id="prz-skanuj" class="akt" title="Skan tylko czyta dyski — zmieniasz coś wyłącznie sam (🗑 Usuń)">⟳ Skanuj</button>
  <button id="prz-przerwij" hidden>Przerwij</button>
  <label title="Przy starcie programu i potem co 6 godzin wczytuję nowe i zmienione pliki (tylko odczyt)">
    <input type="checkbox" id="prz-auto"> odświeżaj samo co 6 h</label>
  <span class="info" id="prz-stan"></span>
  <div class="prz-pasek" id="prz-pasek" hidden><i></i></div>
</div>
<div class="filtr" id="filtr" hidden></div>
<div class="wykres" id="wykres" hidden></div>
<div class="chipy" id="lata"></div>
<div class="chipy" id="miesiace"></div>
<main>
  <div id="os"><div id="siatka"></div></div>
  <div id="mapa" hidden></div>
  <div id="mapa-info" hidden></div>
  <button id="mapa-os" hidden title="Pokaż na osi czasu tylko zdjęcia z widocznego obszaru mapy">📅 Oś czasu tego obszaru</button>
</main>

<div id="pelny" hidden>
  <button class="zam" title="Zamknij (Esc)">✕</button>
  <div class="narz">
    <button id="p-ulub" hidden title="Ulubione (F)">☆ Ulubione</button>
    <button id="p-album" hidden title="Dodaj do albumu">＋ Album</button>
    <button id="p-z-albumu" hidden title="Usuń z tego albumu (zdjęcie zostaje na dysku)">− Z albumu</button>
    <button id="p-pokaz" title="Pokaz slajdów (P)">▶ Pokaz</button>
    <button id="p-usun" hidden title="Usuń (Delete) — do kosza programu: Odłożone/Usunięte, można cofnąć">🗑 Usuń</button>
    <button id="p-otworz" hidden title="Otwórz w programie Windows (np. Filmy i TV, VLC)">⤢ Otwórz w programie</button>
  </div>
  <button class="pop" title="Poprzednie (←)">‹</button>
  <button class="nast" title="Następne (→)">›</button>
  <div id="pelny-tresc"></div>
  <div class="opis" id="pelny-opis"></div>
  <div class="skala" id="pelny-skala" style="opacity:0"></div>
</div>

<div id="login" hidden>
  <form id="login-form">
    <div style="font-size:44px">📚</div>
    <h2 style="margin:6px 0">Biblioteka zdjęć</h2>
    <div class="info">Podaj PIN widoczny na komputerze (Katalogator → 📱 Na telefon).</div>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="PIN">
    <button type="submit">Otwórz</button>
    <div class="bl" id="login-blad"></div>
  </form>
</div>

<div id="w-tip" hidden></div>
<div id="wybierz" hidden>
  <div class="okno">
    <h2 style="margin:0">Dodaj dysk lub folder</h2>
    <div id="wyb-sciezka">Dyski</div>
    <div id="wyb-lista"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="wyb-gora">⬆ W górę</button><span style="flex:1"></span>
      <button id="wyb-anuluj">Anuluj</button><button id="wyb-ok" class="akt" disabled>Wybierz ten folder</button>
    </div>
  </div>
</div>

<div id="telefon" hidden>
  <div class="okno">
    <h2>📱 Katalogator na telefonie</h2>
    <div id="tel-tresc" class="info">Uruchamiam…</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button id="tel-wylacz">Wyłącz udostępnianie</button>
      <button id="tel-zamknij" class="akt">Gotowe</button>
    </div>
  </div>
</div>

<script src="/ui/mapa/leaflet.js"></script>
<script src="/ui/mapa/leaflet.markercluster.js"></script>
<script src="/ui/mapa/qrcode.js"></script>
<div id="toast-g" hidden></div>
<script src="/ui/galeria.js"></script>
</body>
</html>
