name: Model GeoCLIP (ONNX)

# Jednorazowa budowa modelu GeoCLIP dla Katalogatora: koder obrazu (CLIP ViT-L/14 + MLP GeoCLIP) do ONNX z kwantyzacją
# int8 i gotowe cechy galerii 100 tys. miejsc. Wynik trafia do osobnego wydania (prerelease, nie „latest”), skąd program
# pobiera go dopiero, gdy użytkownik włączy rozpoznawanie miejsca ze zdjęcia.
on:
  push:
    paths:
      - "narzedzia/geoclip/**"
      - ".github/workflows/geoclip-model.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: geoclip-model-1

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Czy model już jest
        id: jest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then echo "jest=tak" >> "$GITHUB_OUTPUT"; else echo "jest=nie" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.jest.outputs.jest == 'nie'
        with:
          python-version: "3.11"

      - name: Zależności
        if: steps.jest.outputs.jest == 'nie'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu   # razem: torchvision z PyPI nie pasuje do torch CPU
          python -m pip install "geoclip==1.3.0" transformers onnx onnxscript onnxruntime numpy pillow

      - name: Budowa i sprawdzenie modelu
        if: steps.jest.outputs.jest == 'nie'
        run: python narzedzia/geoclip/zbuduj.py dist

      - name: Wydanie z modelem
        if: steps.jest.outputs.jest == 'nie'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Model GeoCLIP dla Katalogatora
          prerelease: true
          make_latest: "false"
          files: |
            dist/geoclip-obraz-int8.onnx
            dist/geoclip-galeria.npz
            dist/geoclip-sumy.json
          body: |
            Model rozpoznawania miejsca ze zdjęcia (GeoCLIP, NeurIPS 2023, licencja MIT; koder obrazu CLIP ViT-L/14, licencja MIT)
            przekonwertowany do ONNX (int8) dla Katalogatora. Program pobiera go sam, gdy włączysz tę funkcję — nie trzeba nic instalować.
