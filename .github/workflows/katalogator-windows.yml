name: Katalogator.exe (Windows)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "katalogator/**"
      - "tests/**"
      - "uruchom.py"
      - "requirements.txt"
      - "narzedzia/**"
      - "instalator/**"
      - ".github/workflows/katalogator-windows.yml"
  workflow_dispatch:

permissions:
  contents: write   # publikacja wydania (tylko przy tagu v*)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Testy (na Windows)
        run: python -m pytest -q tests

      - name: Wersja
        id: wersja
        shell: pwsh
        run: |
          $w = python -c "import katalogator; print(katalogator.__version__)"
          "wersja=$w" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref }}" -like "refs/tags/v*" -and "${{ github.ref_name }}" -ne "v$w") {
            throw "Tag ${{ github.ref_name }} nie zgadza się z wersją programu $w"
          }

      # Instalator dostaje wersję „folder” (onedir): program startuje z własnego folderu, bez rozpakowywania
      # python312.dll do %TEMP%\_MEI… przy każdym starcie — to rozpakowywanie (antywirus, sprzątanie Temp)
      # dawało czasem „Failed to load Python DLL”. Jednoplikowy Katalogator.exe zostaje jako wersja przenośna.
      - name: Budowanie (folder dla instalatora)
        run: >
          pyinstaller --noconfirm --onedir --windowed --name Katalogator
          --distpath dist\instalacja --workpath build\instalacja
          --icon katalogator/dane/ikona.ico
          --add-data "katalogator/ui;katalogator/ui"
          --add-data "katalogator/dane;katalogator/dane"
          --collect-all pillow_heif
          uruchom.py

      - name: Budowanie Katalogator.exe (wersja przenośna, jeden plik)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Katalogator
          --workpath build\przenosna
          --icon katalogator/dane/ikona.ico
          --add-data "katalogator/ui;katalogator/ui"
          --add-data "katalogator/dane;katalogator/dane"
          --collect-all pillow_heif
          uruchom.py

      - name: Test uruchomienia exe (serwer startuje)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\instalacja\Katalogator\Katalogator.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Katalogator.exe zakonczyl sie od razu (kod $($p.ExitCode))" }
          taskkill /PID $p.Id /T /F 2>&1 | Out-Null  # proces Edge bywa nie do zabicia — to nie błąd programu
          $global:LASTEXITCODE = 0
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $p = Start-Process -FilePath dist\Katalogator.exe -PassThru  # wersja przenośna też musi wstać
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Przenosny Katalogator.exe zakonczyl sie od razu (kod $($p.ExitCode))" }
          taskkill /PID $p.Id /T /F 2>&1 | Out-Null
          $global:LASTEXITCODE = 0
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Item dist\Katalogator.exe | Select-Object Name, Length

      - name: Test trybu automatycznego (--auto, bez okna)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\instalacja\Katalogator\Katalogator.exe -ArgumentList "--auto","nie-ma-takiego" -PassThru
          if (-not $p.WaitForExit(90000)) { taskkill /PID $p.Id /T /F | Out-Null; throw "--auto nie zakonczyl sie w 90 s" }
          if ($p.ExitCode -ne 0) { throw "--auto zwrocil kod $($p.ExitCode)" }

      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DWersja=${{ steps.wersja.outputs.wersja }}" instalator\katalogator.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC zwrocil kod $LASTEXITCODE" }

      - name: Test instalacji i odinstalowania
        shell: pwsh
        run: |
          $setup = "dist\Katalogator-Setup-${{ steps.wersja.outputs.wersja }}.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=pulpit" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Instalacja zwrocila kod $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\Katalogator\Katalogator.exe"
          if (-not (Test-Path $exe)) { throw "Brak zainstalowanego programu: $exe" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Katalogator\_internal")) { throw "Brak folderu _internal (wersja folder)" }
          $p = Start-Process -FilePath $exe -PassThru  # zainstalowany program wstaje
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Zainstalowany Katalogator.exe zakonczyl sie od razu (kod $($p.ExitCode))" }
          taskkill /PID $p.Id /T /F 2>&1 | Out-Null
          $global:LASTEXITCODE = 0
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $skrot = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "Katalogator.lnk" -Recurse
          if (-not $skrot) { throw "Brak skrotu w menu Start" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Katalogator.lnk")) { throw "Brak skrotu na pulpicie" }
          $u = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\Katalogator\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Program nie zostal odinstalowany" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Katalogator\_internal") { throw "Zostal folder _internal po odinstalowaniu" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Katalogator")) { throw "Odinstalowanie usunelo dane uzytkownika" }

      - name: Dziennik błędów (diagnostyka)
        if: always()
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\Katalogator\logi\katalogator.log"
          if (Test-Path $log) { Get-Content $log -Tail 120 } else { "Brak dziennika" }

      - uses: actions/upload-artifact@v4
        with:
          name: Katalogator-windows
          path: |
            dist/Katalogator.exe
            dist/Katalogator-Setup-*.exe
          retention-days: 90

      - name: Czy wydanie tej wersji już istnieje
        id: wydanie
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.wersja.outputs.wersja }}" --repo "${{ github.repository }}" *> $null
          $nowe = if ($LASTEXITCODE -eq 0) { "nie" } else { "tak" }
          "nowe=$nowe" >> $env:GITHUB_OUTPUT
          "Nowe wydanie: $nowe"
          exit 0

      - name: Wydanie na GitHubie (nowa wersja programu)
        if: steps.wydanie.outputs.nowe == 'tak'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.wersja.outputs.wersja }}
          target_commitish: ${{ github.sha }}
          name: Katalogator ${{ steps.wersja.outputs.wersja }}
          make_latest: "true"
          files: |
            dist/Katalogator-Setup-*.exe
            dist/Katalogator.exe
          body: |
            **Instalacja:** pobierz `Katalogator-Setup-${{ steps.wersja.outputs.wersja }}.exe` i uruchom
            (instaluje się bez uprawnień administratora, tworzy skrót w menu Start).
            `Katalogator.exe` to wersja przenośna — bez instalacji (przy każdym starcie rozpakowuje się do folderu
            tymczasowego; jeśli czasem pokazuje „Failed to load Python DLL”, użyj instalatora).

            Program sam powiadomi o kolejnych wersjach.
